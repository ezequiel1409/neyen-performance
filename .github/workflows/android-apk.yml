name: Build Android APK (Capacitor Free Cloud Build)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compilar APK Nativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java JDK 21 para Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias y sincronizar Capacitor Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Compilar APK instalable con Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../neyima-performance.apk

      - name: Publicar instalador como Artifact de Actions
        uses: actions/upload-artifact@v4
        with:
          name: neyima-performance-android-apk
          path: neyima-performance.apk
          retention-days: 30

      - name: Publicar APK de descarga directa en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: NEYIMA Performance Android APK (Última versión)
          body: |
            Compilación automática desde `main` (`${{ github.sha }}`).

            Descargá e instalá `neyima-performance.apk` directamente en tu celular Android.
          files: neyima-performance.apk
          make_latest: true
          fail_on_unmatched_files: true
