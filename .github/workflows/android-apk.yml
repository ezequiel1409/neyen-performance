name: Build Android APK (Capacitor Free Cloud Build)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compilar APK Nativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java JDK 21 para Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias y sincronizar Capacitor Android
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Compilar APK instalable con Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar instalador neyima-performance.apk para descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: neyima-performance-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
